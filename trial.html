<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- responsive to mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shaimaa Hassan Bot Application</title>
    <link rel="icon" href="pictures/download.png"><!--icone rebote-->
    <!-- icon style sheets -->
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/all.min.css">
    <!-- main style_t css file -->
    <link rel="stylesheet" href="css/style_t.css">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@100;300;400;600&display=swap" rel="stylesheet">
<!-- Bootstrap5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- render all elements normally -->
<link rel="stylesheet" href="css/normalize.css">
</head>
<body>
    

<div class="bot-app">
    <div class="content">


        <div class="bot-info bg-primary d-flex align-items-center position-fixed top-0 w-100" >
            <div class="bot-img pt-2 pb-2 ps-5 pe-2" >
                <img src="pictures/download.png" class="rounded-circle" style="width:50px ;" alt="robt-pic">
            </div>
            <h2 class="bot-name text-capitalize fs-4 text-white">mr. robot</h2>
        </div>


        <div id="chat-area"  style=" margin-top: 66px;">
            <!-- <p class="msg p-2 " style="background-color: #ddd;">صباح الخير</p>
            <p class="answer bg-info p-2" >صباح الصباح فتاح ياعليم</p> -->
        </div>


        <form autocomplete="off" class="bottom-0 position-fixed w-100">
            <input class="bg-dark text-light w-75 p-2 border-0 " style="outline: none; " id="message" type="text" placeholder="message" ><input class="w-25 btn-primary p-2 text-capitalize border-0" style="outline: none;" id="send" type="submit" value="send">
        </form>


    </div>
</div>



    <!-- js-Bootstrap5 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- js -->
    <script src="main.js"></script>
</body>
</html>
